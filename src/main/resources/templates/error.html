<!DOCTYPE html>
<html xmlns:th="https://www.thymeleaf.org" 
      th:replace="~{fragments/layout :: layout (~{::body},'error')}">

<body>

  <div class="glass-card error-card" style="text-align: center; max-width: 680px; margin: 40px auto; padding: 48px 36px;">
    <div style="width: 80px; height: 80px; margin: 0 auto 20px; background: #fef2f2; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 36px; border: 1px solid #fecaca; box-shadow: 0 4px 15px rgba(239, 68, 68, 0.15);">
      ⚠️
    </div>
    
    <h2 style="font-size: 26px; font-weight: 800; color: #1e293b; margin-bottom: 12px;">요청 처리 중 오류가 발생했습니다</h2>
    <p style="color: #64748b; font-size: 15px; margin-bottom: 24px; line-height: 1.6;">
      스프링 부트의 글로벌 예외 처리(Error Handling)가 정상 동작하여 안전한 에러 안내 페이지가 렌더링되었습니다.<br/>
      시스템 내부 경로나 보안 민감 스택트레이스는 완벽히 마스킹 보호되고 있습니다.
    </p>

    <div style="background: #f8fafc; border: 1px solid #e2e8f0; border-radius: 12px; padding: 16px 20px; margin-bottom: 28px; text-align: left;">
      <div style="font-size: 12px; font-weight: 700; color: #64748b; margin-bottom: 6px; text-transform: uppercase;">예외 처리 결과 (Showcase Info)</div>
      <div style="font-size: 14px; color: #ef4444; font-weight: 600; word-break: break-all;" th:text="${message ?: 'Expected: controller used to showcase what happens when an exception is thrown'}">
        Expected: controller used to showcase what happens when an exception is thrown
      </div>
    </div>

    <div style="display: flex; justify-content: center; gap: 12px;">
      <a th:href="@{/}" class="btn-modern btn-primary-modern">
        <span class="fa fa-home"></span> 홈 화면으로 이동
      </a>
      <a th:href="@{/vets.html}" class="btn-modern btn-outline-modern">
        <span class="fa fa-user-md"></span> 수의사 목록 조회
      </a>
    </div>
  </div>

</body>
</html>
